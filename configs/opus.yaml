# Experiment config: Opus generation model.
# Identical to configs/sonnet.yaml in every way EXCEPT `model`.
model: claude-opus-4-8

# Cheaper model used only for the blind-solve validation step (an independent,
# lower-cost checker). Generation and adversarial review use `model` above.
checker_model: claude-haiku-4-5-20251001

discrete:
  questions_per_topic: 10
  max_retries: 3
  temperature_generate: 0.8
  temperature_validate: 0.3
  batch_size: 5           # concurrent requests to Anthropic API

  # Independent model for the DISCRETE blind-solve check ONLY (generation +
  # adversarial review stay on `model`, i.e. Opus here). Sonnet follows the JSON
  # contract more reliably than Haiku and is stronger on hard items, matching CARS.
  discrete_checker_model: claude-sonnet-4-6

cars:
  passages_per_topic: 60   # TOTAL CARS passages to generate this beta run (not per-category)
  questions_per_passage_range: [5, 7]   # was a fixed 10; real CARS carries ~5-7 per passage
  passage_word_range: [500, 600]
  max_retries: 3
  temperature_generate: 0.8
  temperature_validate: 0.3
  batch_size: 5            # lower because passages are longer

  # Independent model for the CARS blind-solve check ONLY (generation +
  # adversarial review stay on `model`, i.e. Opus here). Sonnet is strong enough
  # for dense CARS reading and avoids "Opus checking Opus" weak independence.
  cars_checker_model: claude-sonnet-4-6

  # CARS passages are drawn 50/50 from the AAMC's official humanities and
  # social science discipline lists.
  humanities_subjects:
    - Architecture
    - Art
    - Dance
    - Ethics
    - Literature
    - Music
    - Philosophy
    - Popular Culture
    - Religion
    - Theater
    - Studies of Diverse Cultures

  social_science_subjects:
    - Anthropology
    - Archaeology
    - Economics
    - Education
    - Geography
    - History
    - Linguistics
    - Political Science
    - Population Health
    - Psychology
    - Sociology
    - Studies of Diverse Cultures

science_passage:
  passages_per_topic_cluster: 2
  questions_per_passage_range: [4, 7]

  # Independent model for the SCIENCE blind-solve check ONLY (generation +
  # adversarial review stay on `model`, i.e. Opus here). Sonnet follows the JSON
  # contract more reliably than Haiku and is stronger on hard items, matching CARS.
  science_checker_model: claude-sonnet-4-6
  # enable_figures=true turns on the structural figure pipeline (chemistry SMILES
  # via rdkit + plots via matplotlib; deps checked at startup) AND keeps the
  # REQUIRED_FIGURES enforcement backstop active in
  # src/pipelines/science_passage.py (5B/5D->smiles, 5A/5E->plot).
  enable_figures: true

checkpoint_dir: ./checkpoints
output_dir: ./output
topics_file: ./mcat_topics.json
